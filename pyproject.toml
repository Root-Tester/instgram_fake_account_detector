[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instgram-fake-account-detector"
version = "2.01.0"
description = "Explainable Instagram profile and public post risk analysis"
requires-python = ">=3.10"
dependencies = [
  "streamlit",
  "pandas",
  "numpy",
  "xgboost",
  "matplotlib",
  "scikit-learn",
  "pillow",
  "requests",
  "joblib",
]

[tool.setuptools.packages.find]
where = ["src"]
