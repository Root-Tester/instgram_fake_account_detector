name: SLSA provenance

on:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build release artifact
        id: package
        shell: bash
        env:
          ARTIFACT: instgram_fake_account_detector-${{ github.sha }}.tar.gz
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix="instgram_fake_account_detector/" HEAD -o "$ARTIFACT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Generate subject for provenance
        id: hash
        shell: bash
        env:
          ARTIFACT: ${{ steps.package.outputs.artifact }}
        run: |
          set -euo pipefail
          echo "digests=$(sha256sum "$ARTIFACT" | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ steps.package.outputs.artifact }}
        run: gh release upload "$GITHUB_REF_NAME" "$ARTIFACT" --clobber

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ steps.package.outputs.artifact }}
          if-no-files-found: error

  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.9.1
    with:
      base64-subjects: ${{ needs.build.outputs.digests }}
      provenance-name: instgram_fake_account_detector.intoto.jsonl
      upload-assets: true
